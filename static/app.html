/* Layout: светлая «комната» с золотом из логотипа, карты — главное; просмотр карты — на тёмной сцене.

:root {

  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

}
@media (min-width: 720px) { :root { --gutter-l: max(32px, env(safe-area-inset-left, 0px)); --gutter-r: max(32px, env(safe-area-inset-right, 0px)); } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-ui); -webkit-text-size-adjust: 100%; }

img { max-width: 100%; display: block; }
a { color: var(--gold-deep); }
button { font: inherit; color: inherit; }

h2 { font-size: clamp(1.45rem, 4vw, 1.9rem); }
p { margin: 0 0 1em; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

.flow { background: var(--ink); color: #efe6d3; border-radius: 20px; padding: clamp(22px, 5vw, 44px); margin-top: 26px; }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }

.tile { position: relative; display: block; width: 100%; padding: 0; border: 0; background: #e9e3d7; border-radius: 9px; overflow: hidden; cursor: zoom-in; box-shadow: 0 1px 2px rgba(30, 27, 22, .08); transition: transform .15s, box-shadow .15s; }

@media (hover: hover) { .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(30, 27, 22, .16); } }
.tile.chosen, .cell.in .tile { box-shadow: 0 0 0 3px var(--gold), 0 6px 18px rgba(30, 27, 22, .16); }

.rnd { position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: rgba(30, 27, 22, .72); color: #f3e3bd; font-size: .75rem; display: grid; place-items: center; }

/* подборка участника */
.collection { padding-bottom: 120px; }
.note { margin-top: 22px; font-size: .85rem; color: var(--muted); max-width: 36em; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(250, 247, 241, .95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px calc(10px + var(--safe-b)); min-height: 60px; }
.bar-thumb { flex: none; width: 40px; padding: 0; border: 0; border-radius: 6px; overflow: hidden; cursor: pointer; box-shadow: 0 0 0 2px var(--gold); background: none; }

/* сборка подборки */

.cell { position: relative; display: grid; gap: 4px; }

.zoom-btn { position: absolute; top: 5px; left: 5px; width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(30, 27, 22, .72); color: #fff; display: grid; place-items: center; }
.zoom-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.saved { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }

.viewer { position: fixed; inset: 0; z-index: 100; background: var(--stage); color: var(--stage-ink); opacity: 0; transition: opacity .18s; touch-action: none; --top: calc(56px + env(safe-area-inset-top, 0px)); --bottom: calc(12px + var(--safe-b)); }

.viewer.open { opacity: 1; }

.vimg { position: absolute; max-width: none; transform-origin: 50% 50%; border-radius: 8px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; will-change: transform; }

.vnav.prev { left: max(12px, env(safe-area-inset-left, 0px)); } .vnav.next { right: max(12px, env(safe-area-inset-right, 0px)); }

.vbottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px var(--gutter-r) calc(14px + var(--safe-b)) var(--gutter-l); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; max-width: 520px; margin: 0 auto; min-height: calc(118px + var(--safe-b)); }

.vhint { margin: 0; font-size: .85rem; color: var(--stage-muted); }
.linkbtn.light { color: #e9dcbf; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: #1b1915; border-top: 1px solid #2f2b23; border-radius: 18px 18px 0 0; padding: 10px var(--gutter-r) calc(22px + var(--safe-b)) var(--gutter-l); max-width: 560px; margin: 0 auto; box-shadow: 0 -10px 30px rgba(0, 0, 0, .4); }

.qr-full { position: fixed; inset: 0; z-index: 150; background: #fff; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px var(--gutter-r) calc(24px + var(--safe-b)) var(--gutter-l); text-align: center; overflow: auto; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

  $('grid').addEventListener('click', (e) => { const b = e.target.closest('.tile'); if (b) openViewer(CARDS, Number(b.dataset.i)); });
}

// Фасилитатор: собирает подборку, получает ссылку и QR. Черновик и «Мои подборки» — в этом браузере.
function viewMake() {
  chrome('make');
  const draft = store.json('dc_draft', { title: '', nums: [] });
  let nums = draft.nums.filter((n) => BY_N.has(n));
  let title = draft.title || '';
  let askDelete = null;
  main.innerHTML = `<div class="wrap page">
    <h1>${esc(t('makeTitle'))}</h1>
    <p class="lead">${esc(t('makeLead'))}</p>
    <div class="maker">
      <section>
        <label class="field">${esc(t('titleLabel'))}<input type="text" id="m-title" maxlength="60" placeholder="${esc(t('titlePh'))}" value="${esc(title)}"></label>
        <div class="row" style="margin:16px 0 10px"><strong id="m-count"></strong><button class="linkbtn" type="button" id="m-clear">${esc(t('clear'))}</button></div>
        <p class="muted small" id="m-full" hidden>${esc(t('full'))}</p>
        <div class="cells" id="m-cells"></div>
      </section>
      <aside class="share" id="m-share"></aside>
    </div></div>`;
  const persist = () => store.set('dc_draft', JSON.stringify({ title, nums }));
  function drawCells() {
    const full = nums.length >= MAX;
    $('m-count').textContent = t('picked', { n: nums.length });
    $('m-full').hidden = !full;
    $('m-cells').innerHTML = CARDS.map((c, i) => {
      const on = nums.includes(c.n);
      return `<div class="cell ${on ? 'in' : ''} ${!on && full ? 'off' : ''}">
        <button class="tile" type="button" data-n="${c.n}" aria-pressed="${on}" ${!on && full ? 'disabled' : ''} aria-label="${esc(c.code)}">
          <img src="${c.thumb}" alt="" loading="lazy" width="${c.width}" height="${c.height}">${on ? `<span class="check">${ICON.check}</span>` : ''}</button>
        <button class="zoom-btn" type="button" data-view="${i}" aria-label="${esc(t('view'))} ${esc(c.code)}">${ICON.expand}</button>
        <small>${esc(c.code)}</small></div>`;
    }).join('');
  }
  function drawShare() {
    const saved = store.json('dc_saved', []);
    const sorted = [...nums].sort((a, b) => a - b);
    const url = sorted.length ? BASE + '#' + selHash(sorted, title) : '';
    $('m-share').innerHTML = `<h2>${esc(t('shareTitle'))}</h2>
      ${url ? `<div class="qr-mini">${qrSvg(url)}</div>
        <code id="m-url">${esc(url)}</code>
        <div class="row">
          <button class="btn sm" type="button" id="m-copy">${esc(t('copy'))}</button>
          <button class="btn sm dark" type="button" id="m-qr">${esc(t('showQr'))}</button>
          ${OWN ? `<a class="btn sm" id="m-dl" href="#" download="dialogue-cards-qr.png">${esc(t('downloadQr'))}</a>` : ''}
          <a class="btn sm" href="#${selHash(sorted, title)}">${esc(t('openAs'))}</a>
        </div>
        <p class="small muted">${esc(t('changed'))}${OWN ? '' : ' ' + esc(t('siteNote'))}</p>
        <button class="btn sm" type="button" id="m-save">${esc(t('save'))}</button>`
      : `<p class="muted">${esc(t('needCards'))}</p>`}
      ${saved.length ? `<h2 style="margin-top:8px">${esc(t('savedTitle'))}</h2><p class="small muted" style="margin:0">${esc(t('savedHint'))}</p>
        <ul class="saved">${saved.map((s, k) => askDelete === k
          ? `<li class="ask">${esc(t('delAsk', { t: s.title || t('untitled') }))} <button class="btn sm" type="button" data-del-yes="${k}">${esc(t('yes'))}</button><button class="linkbtn" type="button" data-del-no>${esc(t('no'))}</button></li>`
          : `<li><strong>${esc(s.title || t('untitled'))}</strong><span class="small muted">${esc(t('nSaved', { n: s.nums.length }))}</span>
             <button class="linkbtn" type="button" data-load="${k}">${esc(t('edit'))}</button>
             <button class="linkbtn danger" type="button" data-del="${k}">${esc(t('del'))}</button></li>`).join('')}</ul>` : ''}`;
    if (url) {
      $('m-copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(url); toast(t('copied')); }
        catch (e) { const r = document.createRange(); r.selectNodeContents($('m-url')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      });
      $('m-qr').addEventListener('click', () => showQr(title, url));
      const dl = $('m-dl'); if (dl) dl.href = qrPng(url);
      $('m-save').addEventListener('click', () => {
        const list = store.json('dc_saved', []);
        const key = selHash(sorted, title);
        const rest = list.filter((s) => selHash(s.nums, s.title) !== key);
        rest.unshift({ title, nums: sorted });
        store.set('dc_saved', JSON.stringify(rest.slice(0, 50)));
        toast(t('savedToast')); drawShare();
      });
    }
  }
  $('m-cells').addEventListener('click', (e) => {
    const v = e.target.closest('[data-view]');
    if (v) { openViewer(CARDS, Number(v.dataset.view)); return; }
    const b = e.target.closest('[data-n]'); if (!b) return;
    const n = Number(b.dataset.n);
    if (nums.includes(n)) nums = nums.filter((x) => x !== n); else if (nums.length < MAX) nums.push(n);
    persist(); drawCells(); drawShare();
  });
  $('m-share').addEventListener('click', (e) => {
    const load = e.target.closest('[data-load]'), del = e.target.closest('[data-del]'), yes = e.target.closest('[data-del-yes]');
    const list = store.json('dc_saved', []);
    if (load) { const s = list[Number(load.dataset.load)]; title = s.title; nums = [...s.nums]; $('m-title').value = title; persist(); drawCells(); drawShare(); window.scrollTo(0, 0); }
    else if (del) { askDelete = Number(del.dataset.del); drawShare(); }
    else if (yes) { list.splice(Number(yes.dataset.delYes), 1); store.set('dc_saved', JSON.stringify(list)); askDelete = null; drawShare(); }
    else if (e.target.closest('[data-del-no]')) { askDelete = null; drawShare(); }
  });
  $('m-title').addEventListener('input', (e) => { title = e.target.value; persist(); drawShare(); });
  $('m-clear').addEventListener('click', () => { nums = []; persist(); drawCells(); drawShare(); });
  drawCells(); drawShare();
}

// Участник: подборка из ссылки, выбор карты сохраняется на этом устройстве.
function viewCollection(hash) {
  chrome('');
  const sel = parseSel(hash);
  if (!sel || !sel.nums.length) { main.innerHTML = `<div class="wrap page"><p class="error-box">${esc(t('badLink'))}</p></div>`; return; }
  const cards = sel.nums.map((n) => BY_N.get(n));
  const key = 'dc_sel_' + hash;
  const st = store.json(key, { round: 1, picks: {} });
  const save = () => store.set(key, JSON.stringify(st));
  const choiceIn = (r) => st.picks[r] || null;
  let asking = false;
  main.innerHTML = `<div class="wrap page collection">
      <p class="eyebrow">${esc(t('colBadge'))}</p>
      <h1>${esc(sel.title || t('colBadge'))}</h1>
      <p class="muted">${esc(t('colHint'))}</p>
      <div class="grid" id="c-grid"></div>
      <p class="note">${esc(t('colNote'))}</p>
    </div>
    <div class="bar"><div class="wrap" id="c-bar"></div></div>`;
  function drawGrid() {
    const cur = choiceIn(st.round);
    $('c-grid').innerHTML = cards.map((c, i) => {
      const earlier = Object.entries(st.picks).filter(([r, n]) => n === c.n && Number(r) !== st.round).map(([r]) => r);
      const badge = c.n === cur ? `<span class="check">${ICON.check}</span>` : earlier.length ? `<span class="rnd">${earlier.join(', ')}</span>` : '';
      return tile(c, i, c.n === cur ? 'chosen' : '', badge);
    }).join('');
  }
  function drawBar() {
    const cur = choiceIn(st.round), c = cur && BY_N.get(cur);
    const roundLbl = st.round > 1 || Object.keys(st.picks).length ? `<span>${esc(t('round', { n: st.round }))}</span>` : '';
    if (asking) {
      $('c-bar').innerHTML = `<div class="bar-text"><strong>${esc(t('roundAsk', { n: st.round + 1 }))}</strong></div>
        <button class="btn sm dark" type="button" data-round-yes>${esc(t('yes'))}</button><button class="linkbtn" type="button" data-round-no>${esc(t('no'))}</button>`;
    } else if (c) {
      $('c-bar').innerHTML = `<button class="bar-thumb" type="button" data-open="${c.n}" aria-label="${esc(c.code)}"><img src="${c.thumb}" alt=""></button>
        <div class="bar-text"><strong>${esc(t('yourChoice'))}</strong>${roundLbl}</div>
        <button class="btn sm" type="button" data-round>${esc(t('nextRound'))}</button>`;
    } else {
      $('c-bar').innerHTML = `<div class="bar-text"><span style="font-size:.95rem">${esc(t('noChoice'))}</span>${roundLbl}</div>`;
    }
  }
  const redraw = () => { drawGrid(); drawBar(); if (viewer) viewer.refresh(); };
  const api = {
    choice: () => choiceIn(st.round),
    choose(n) { st.picks[st.round] = n; save(); toast(t('selSaved')); redraw(); },
    cancel() { delete st.picks[st.round]; save(); toast(t('selCancelled')); redraw(); },
  };
  $('c-grid').addEventListener('click', (e) => { const b = e.target.closest('.tile'); if (b) openViewer(cards, Number(b.dataset.i), { collection: api }); });
  $('c-bar').addEventListener('click', (e) => {
    const o = e.target.closest('[data-open]');
    if (o) openViewer(cards, cards.findIndex((c) => c.n === Number(o.dataset.open)), { collection: api });
    if (e.target.closest('[data-round]')) { asking = true; drawBar(); }
    if (e.target.closest('[data-round-no]')) { asking = false; drawBar(); }
    if (e.target.closest('[data-round-yes]')) { asking = false; st.round = Math.min(st.round + 1, 20); save(); redraw(); toast(t('roundStarted', { n: st.round })); }
  });
  redraw();
}

function route() {
  closeViewer(true);
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'library') viewLibrary();
  else if (h === 'make') viewMake();
  else if (h.startsWith('s-')) viewCollection(h);
  else viewHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('lang').addEventListener('click', () => { lang = lang === 'ru' ? 'en' : 'ru'; store.set('dc_lang', lang); route(); });
route();
})();
</script>
