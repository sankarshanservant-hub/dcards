# Проверка доступности (28.11.2026): раз в 30 минут — имя dialogue.cards находится в DNS и оба входа приложения
# отвечают. При сбое открывается задача (issue) — GitHub присылает владельцу письмо и уведомление в приложении.
# Когда сайт снова отвечает, задача закрывается сама. Только чтение публичных адресов, без секретов.
name: Доступность сайта
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS и ответ сайта
        id: probe
        run: |
          fail=""
          for host in dialogue.cards www.dialogue.cards; do
            ip=$(dig +short A "$host" @1.1.1.1 | tail -1)
            [ -n "$ip" ] || fail="$fail\n- $host: имя не находится в DNS (сервер 1.1.1.1)"
            ip8=$(dig +short A "$host" @8.8.8.8 | tail -1)
            [ -n "$ip8" ] || fail="$fail\n- $host: имя не находится в DNS (сервер 8.8.8.8)"
          done
          for url in https://dialogue.cards/api/version https://harekrishna.info/dialogue-cards/api/version; do
            ok=""
            for i in 1 2 3; do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url"); [ "$code" = 200 ] && ok=1 && break; sleep 20; done
            [ -n "$ok" ] || fail="$fail\n- $url: ответ $code"
          done
          echo "fail<<EOF" >> "$GITHUB_OUTPUT"; printf "%b\n" "$fail" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Задача о сбое — открыть или закрыть
        uses: actions/github-script@v7
        env:
          FAIL: ${{ steps.probe.outputs.fail }}
        with:
          script: |
            const title = 'Сайт Dialogue Cards недоступен';
            const fail = (process.env.FAIL || '').trim();
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'uptime' });
            const cur = open.find((i) => i.title === title);
            if (fail && !cur) {
              await github.rest.issues.create({ ...context.repo, title, labels: ['uptime'],
                body: `Автоматическая проверка ${new Date().toISOString()} не прошла:\n${fail}\n\nЕсли не находится имя — проверьте домен в name.com (срок регистрации, DNS-записи A для dialogue.cards и www). Если нет ответа — сервер или nginx.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_` });
            } else if (fail && cur) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: cur.number, body: `Всё ещё недоступен (${new Date().toISOString()}):\n${fail}` });
            } else if (!fail && cur) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: cur.number, body: `Снова доступен (${new Date().toISOString()}).` });
              await github.rest.issues.update({ ...context.repo, issue_number: cur.number, state: 'closed' });
            }
